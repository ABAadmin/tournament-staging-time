
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABA Tournament Staging Times</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      text-align: center;
      margin: 0;
      padding: 25px;
    }
    h1 { color: #174a92; }
    .panel {
      background: white;
      padding: 25px;
      border-radius: 14px;
      max-width: 550px;
      margin: 25px auto;
      box-shadow: 0 2px 12px #ddd;
    }
    input, button {
      padding: 14px;
      font-size: 18px;
      margin: 8px;
    }
    button {
      background: #174a92;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .time {
      font-size: 48px;
      font-weight: bold;
      color: #174a92;
    }
  </style>
</head>
<body>
  <h1>ABA Tournament</h1>
  <h2>Staging Time</h2>

  <div class="panel">
    <h3>Current Staging Time</h3>
    <div class="time" id="display">--:--</div>
  </div>

  <div class="panel">
    <h3>Update Staging Time</h3>
    <input type="time" id="stagingTime">
    <button onclick="updateTime()">Update</button>
  </div>

  <script>
    function updateTime() {
      const time = document.getElementById("stagingTime").value;
      if (!time) return alert("Please select a time");

      const [h, m] = time.split(":");
      const formatted = new Date(2000, 0, 1, h, m)
        .toLocaleTimeString("en-US", {
          hour: "numeric",
          minute: "2-digit"
        });

      document.getElementById("display").textContent = formatted;
    }
  </script>
</body>
</html>
